<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I WANNA MARIO: FIRE CHAIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b35;color:white;font:14px Arial,"Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:18px}
main{width:min(100%,960px)}h1{font-size:22px;margin:0 0 12px}.shell{border:3px solid #d7dcff;border-radius:9px;overflow:hidden;box-shadow:0 18px 55px #0008}canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated}.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;line-height:1.8;color:#d5dcff}button{background:#303d79;color:white;border:1px solid #7282ce;border-radius:7px;padding:8px 13px;cursor:pointer}.note{font-size:12px;color:#aeb9ed;margin-top:8px}
</style>
<main><h1>🍄 I WANNA MARIO: FIRE CHAIN</h1><div class="shell"><canvas id="g" width="900" height="600" tabindex="0"></canvas></div>
<div class="bar"><div>← → / A D：移动　空格 / ↑ / W：跳跃（二段跳）　X / 左 Shift：冲刺<br>P：暂停　H：帮助　R：重新开始</div><div><button onclick="restartAll()">重新开始 (R)</button> <button onclick="paused=!paused">暂停 (P)</button></div></div>
<div class="note">网页单文件版，无需安装。碰撞判定已适当放宽；抵达绿色旗帜可激活检查点。</div></main>
<script>
const c=document.querySelector('#g'),ctx=c.getContext('2d'),W=900,H=600,WW=4400;
const col={sky:'#698cff',white:'#fff',red:'#e62d2d',blue:'#2355e1',yellow:'#ffdc37',orange:'#ff7d23',fire:'#ff5a19',brick:'#af5023',dark:'#5f2d23',green:'#2daf64',mount:'#3ca596',mount2:'#287d7d',gray:'#5f6478',cyan:'#32e6ff'};
const plats=[[0,520,520,80],[590,455,160,22],[810,390,160,22],[1030,455,210,22],[1300,380,160,22],[1515,315,180,22],[1750,430,210,22],[2020,365,160,22],[2230,300,180,22],[2470,420,210,22],[2740,350,170,22],[2960,285,180,22],[3200,410,220,22],[3480,340,180,22],[3710,270,180,22],[3950,420,450,180]];
const spikes=[[260,520,80],[630,455,40],[875,390,40],[1110,455,60],[1550,315,45],[1810,430,60],[2070,365,45],[2280,300,45],[2530,420,60],[2800,350,40],[3015,285,50],[3270,410,60],[3530,340,45],[3770,270,50]];
const bars=[[390,465,8,24,.035,0],[690,400,7,24,-.045,1.2],[900,335,8,23,.05,.6],[1130,400,9,23,-.04,2.2],[1380,325,8,24,.055,.3],[1600,260,9,23,-.05,1.7],[1850,375,9,24,.043,.8],[2100,310,8,24,-.055,2.5],[2320,245,9,23,.06,.2],[2560,365,10,23,-.048,1.4],[2810,295,9,24,.057,.9],[3030,230,10,23,-.06,2],[3290,355,10,23,.065,.4],[3570,285,10,23,-.06,1.8],[3800,215,10,23,.065,.7]];
const keys=new Set();let frame=0,deaths=0,cam=0,cp=false,paused=false,won=false,help=true,p;
function mk(x=70,y=470){return{x,y,w:27,h:38,vx:0,vy:0,face:1,jumps:0,ground:false,dash:0,cool:0,dashReady:true,dead:false,dt:0}}
p=mk();function restartAll(){deaths=0;cp=false;reset()}function reset(){p=cp?mk(2040,315):mk();frame=0;cam=cp?Math.max(0,2040-450):0;paused=false;won=false}
function box(x,y,w,h){return{x,y,w,h}}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hb(){return box(p.x+5,p.y+5,p.w-10,p.h-8)}
function circleRect(x,y,r,b){let nx=Math.max(b.x,Math.min(x,b.x+b.w)),ny=Math.max(b.y,Math.min(y,b.y+b.h)),dx=x-nx,dy=y-ny;return dx*dx+dy*dy<r*r}
function die(){if(!p.dead){p.dead=true;p.dt=0}}function jump(){if(paused||won||p.dead)return;if(p.jumps===0){p.vy=-11.8;p.jumps=1;p.ground=false}else if(p.jumps===1){p.vy=-10.8;p.jumps=2;p.ground=false}}
function dash(){if(!paused&&!won&&!p.dead&&p.dashReady&&p.cool<=0){p.dash=9;p.cool=30;p.dashReady=false;p.vx=p.face*10.5;p.vy=0}}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(k==='p'&&!p.dead&&!won)paused=!paused;if(k==='h')help=!help;if(k==='r')restartAll();if(!e.repeat&&[' ','arrowup','w'].includes(k))jump();if(!e.repeat&&['x','shift'].includes(k))dash()});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
function update(){if(paused||won)return;if(p.dead){if(++p.dt>38){deaths++;reset()}return}
let d=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);if(d)p.face=d;if(p.cool>0)p.cool--;
if(p.dash>0){p.dash--;p.vx=p.face*10.5;p.vy=0}else{p.vx=d*4;p.vy=Math.min(p.vy+.58,13)}
p.x+=p.vx;let r=box(p.x,p.y,p.w,p.h);for(let [x,y,w,h] of plats){let b=box(x,y,w,h);if(hit(r,b)){if(p.vx>0)p.x=x-p.w;else if(p.vx<0)p.x=x+w;r.x=p.x}}
p.y+=p.vy;r.y=p.y;p.ground=false;for(let [x,y,w,h] of plats){let b=box(x,y,w,h);if(hit(r,b)){if(p.vy>0){p.y=y-p.h;p.ground=true;p.jumps=0;p.dashReady=true}else if(p.vy<0)p.y=y+h;p.vy=0;r.y=p.y}}
p.x=Math.max(0,Math.min(WW-p.w,p.x));if(p.y>H+150)die();let h=hb();
for(let [x,y,w] of spikes)if(hit(h,box(x+4,y-16,w-8,13))){die();break}
if(!p.dead)for(let [ax,ay,n,s,sp,a0] of bars){let a=a0+frame*sp;for(let i=0;i<n;i++){let dist=(i+1)*s;if(circleRect(ax+Math.cos(a)*dist,ay+Math.sin(a)*dist,7,h)){die();break}}if(p.dead)break}
if(hit(h,box(2040,273,24,42)))cp=true;if(hit(h,box(4260,340,45,80)))won=true;cam=Math.max(0,Math.min(WW-W,p.x+p.w/2-W/2));frame++}
function txt(t,x,y,size=20,color='white',align='left'){ctx.font=`bold ${size}px Arial`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}
function background(){ctx.fillStyle=col.sky;ctx.fillRect(0,0,W,H);for(let i=0;i<18;i++){let x=(i*280-cam*.35)%(W+160)-80,y=85+i%3*65;ctx.fillStyle='white';ctx.beginPath();ctx.arc(x,y,19,0,7);ctx.arc(x+20,y-8,23,0,7);ctx.arc(x+42,y,17,0,7);ctx.fillRect(x,y-8,42,16);ctx.fill()}for(let i=-1;i<12;i++){let x=i*180-(cam*.18%180);ctx.fillStyle=col.mount;ctx.beginPath();ctx.moveTo(x,520);ctx.lineTo(x+100,360);ctx.lineTo(x+205,520);ctx.fill();ctx.fillStyle=col.mount2;ctx.beginPath();ctx.moveTo(x+65,520);ctx.lineTo(x+155,410);ctx.lineTo(x+245,520);ctx.fill()}}
function drawPlat(x,y,w,h){let sx=x-cam;if(sx+w< -20||sx>W+20)return;ctx.fillStyle=col.brick;ctx.fillRect(sx,y,w,h);ctx.strokeStyle=col.dark;ctx.strokeRect(sx,y,w,h);for(let yy=y+5;yy<y+h;yy+=18){ctx.beginPath();ctx.moveTo(sx,yy);ctx.lineTo(sx+w,yy);ctx.stroke()}for(let xx=sx+20;xx<sx+w;xx+=40){ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}ctx.strokeStyle='#f59b46';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,y+2);ctx.lineTo(sx+w,y+2);ctx.stroke();ctx.lineWidth=1}
function drawSpikes(){for(let [x,y,w] of spikes){let sx=x-cam;if(sx+w<0||sx>W)continue;for(let xx=sx;xx<sx+w;xx+=20){ctx.fillStyle='#e6ebf5';ctx.strokeStyle=col.gray;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx+10,y-22);ctx.lineTo(xx+20,y);ctx.closePath();ctx.fill();ctx.stroke()}}}
function drawBars(){for(let [ax,ay,n,s,sp,a0] of bars){let a=a0+frame*sp,ex=ax+Math.cos(a)*n*s,ey=ay+Math.sin(a)*n*s,sx=ax-cam;if(Math.max(sx,ex-cam)<-100||Math.min(sx,ex-cam)>W+100)continue;ctx.strokeStyle='#784637';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(sx,ay);ctx.lineTo(ex-cam,ey);ctx.stroke();ctx.fillStyle='#cdcdde';ctx.fillRect(sx-11,ay-11,22,22);ctx.fillStyle=col.fire;ctx.beginPath();ctx.arc(sx,ay,6,0,7);ctx.fill();for(let i=0;i<n;i++){let dist=(i+1)*s,bx=ax+Math.cos(a)*dist-cam,by=ay+Math.sin(a)*dist;ctx.fillStyle='#b43714';ctx.beginPath();ctx.arc(bx,by,12,0,7);ctx.fill();ctx.fillStyle=col.orange;ctx.beginPath();ctx.arc(bx,by,10,0,7);ctx.fill();ctx.fillStyle=col.yellow;ctx.beginPath();ctx.arc(bx,by,6,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(bx-2,by-2,2,0,7);ctx.fill()}}}
function drawPlayer(){let x=Math.round(p.x-cam),y=Math.round(p.y);if(p.dash)for(let i=1;i<4;i++){ctx.fillStyle='rgba(85,110,220,.45)';ctx.fillRect(x-p.face*i*9,y+10,22,22)}ctx.fillStyle='#642d14';ctx.fillRect(x+1,y+31,10,7);ctx.fillRect(x+16,y+31,10,7);ctx.fillStyle=col.blue;ctx.fillRect(x+3,y+19,21,15);ctx.fillStyle=col.yellow;ctx.fillRect(x+7,y+21,4,4);ctx.fillRect(x+17,y+21,4,4);ctx.fillStyle=col.red;ctx.fillRect(x+2,y+12,23,12);ctx.fillStyle='#ffc391';ctx.fillRect(x+5,y+4,19,17);ctx.fillStyle='#4b2314';ctx.fillRect(x+2,y+9,8,10);ctx.fillRect(x+9,y+14,13,5);let ex=p.face>0?x+18:x+9;ctx.fillStyle='white';ctx.fillRect(ex,y+8,4,5);ctx.fillStyle='#19141e';ctx.fillRect(ex+1,y+10,2,2);ctx.fillStyle=col.red;ctx.fillRect(x+3,y,22,8);ctx.fillRect(x,y+5,27,5);ctx.fillStyle='white';ctx.fillRect(x+12,y+1,4,4)}
function draw(){background();plats.forEach(a=>drawPlat(...a));drawSpikes();drawBars();let cx=2040-cam;ctx.fillStyle='white';ctx.fillRect(cx,273,5,42);ctx.fillStyle=col.green;ctx.beginPath();ctx.moveTo(cx+5,273);ctx.lineTo(cx+32,283);ctx.lineTo(cx+5,293);ctx.fill();let gx=4260-cam;ctx.fillStyle=col.yellow;ctx.fillRect(gx,340,8,80);ctx.fillStyle=col.green;ctx.fillRect(gx+8,340,35,8);ctx.fillRect(gx+8,412,35,8);drawPlayer();txt('DEATHS: '+deaths,18,34,20,col.red);txt('X: '+Math.floor(p.x),18,62);txt('JUMPS LEFT: '+(2-p.jumps),18,91,15,col.cyan);txt('DASH: '+(p.dashReady?'READY':'USED'),18,113,15,col.yellow);if(cp)txt('CHECKPOINT ACTIVE',18,136,15,col.green);
if(help){ctx.fillStyle='rgba(15,20,35,.78)';ctx.fillRect(W-342,10,330,112);['A / D or ARROWS: MOVE','SPACE: JUMP / DOUBLE JUMP','X / SHIFT: AIR DASH','P: PAUSE   H: HIDE HELP','R: RESTART'].forEach((s,i)=>txt(s,W-330,31+i*20,15))}
if(p.dead){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,W,H);txt('YOU DIED!',W/2,275,48,col.red,'center')}if(paused){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,275,48,col.yellow,'center')}if(won){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);txt('STAGE CLEAR!',W/2,270,48,col.yellow,'center');txt('Deaths: '+deaths,W/2,315,22,'white','center');txt('Press R to play again',W/2,355,20,col.cyan,'center')}}
function loop(){update();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
